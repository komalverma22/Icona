<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 68 920 660" role="img"><title>Icona illustration: how it works</title><desc>An exploded stack showing how an Icona icon comes together: motion, customize, code, finished icon.</desc><style>
.ic{transform-box:fill-box;transform-origin:center;animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.fly{animation-name:fly6}.trail{opacity:0;animation-name:trail6}
.floor{transform-box:fill-box;transform-origin:center;opacity:0;animation:floor 6s ease-out infinite;animation-delay:1.3s}
.lift{animation:lift 6s both infinite}
.guide{animation:guide 6s both infinite}
.tagin{animation:tagin 6s both infinite}
.chipin{animation:chipin 6s both infinite}
.kf{transform-box:fill-box;transform-origin:center;animation:kf 6s both infinite}
.ln{animation:ln 6s both infinite}
.caret{animation:blink 1s steps(1) infinite}
.k1,.k2,.k3{transform-box:fill-box}
.k1{animation:k1 6s both infinite}.k2{animation:k2 6s both infinite}.k3{animation:k3 6s both infinite}
.s1,.s2,.s3{transform-box:fill-box;transform-origin:0 50%}
.s1{animation:s1 6s both infinite}.s2{animation:s2 6s both infinite}.s3{animation:s3 6s both infinite}
.playhead{animation:ph6 6s both infinite}
.tag{font-family:Inter,system-ui,sans-serif;font-weight:500}
@keyframes lift{0%,4%{transform:translateY(var(--dy));animation-timing-function:cubic-bezier(.2,1.25,.35,1)}26%{transform:translateY(0)}80%{transform:translateY(0);animation-timing-function:cubic-bezier(.6,0,.9,.4)}94%,100%{transform:translateY(var(--dy))}}
@keyframes guide{0%,18%{opacity:0}28%,80%{opacity:1}90%,100%{opacity:0}}
@keyframes tagin{0%,24%{opacity:0;transform:translateX(-14px)}32%,80%{opacity:1;transform:translateX(0)}90%,100%{opacity:0;transform:translateX(-14px)}}
@keyframes chipin{0%,24%{opacity:0;transform:translateX(14px)}32%,80%{opacity:1;transform:translateX(0)}90%,100%{opacity:0;transform:translateX(14px)}}
@keyframes kf{0%,100%{transform:scale(1)}1.5%{transform:scale(1.7)}4%{transform:scale(1)}}
@keyframes ln{0%,30%{opacity:0;transform:translateX(-6px)}35%,80%{opacity:1;transform:translateX(0)}90%,100%{opacity:0;transform:translateX(-6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes k1{0%,32%{transform:translateX(0)}42%,52%{transform:translateX(44px)}60%,100%{transform:translateX(0)}}
@keyframes k2{0%,35%{transform:translateX(0)}45%,55%{transform:translateX(22px)}62%,100%{transform:translateX(0)}}
@keyframes k3{0%,38%{transform:translateX(0)}48%,56%{transform:translateX(58px)}64%,100%{transform:translateX(0)}}
@keyframes s1{0%,32%{transform:scaleX(.02)}42%,52%{transform:scaleX(.62)}60%,100%{transform:scaleX(.02)}}
@keyframes s2{0%,35%{transform:scaleX(.02)}45%,55%{transform:scaleX(.31)}62%,100%{transform:scaleX(.02)}}
@keyframes s3{0%,38%{transform:scaleX(.02)}48%,56%{transform:scaleX(.8)}64%,100%{transform:scaleX(.02)}}
@keyframes ph6{0%,30%{transform:translateX(0)}52%,100%{transform:translateX(102px)}}
@keyframes floor{0%{transform:scale(.3);opacity:0}5%{opacity:.7}45%,100%{transform:scale(1);opacity:0}}
@keyframes fly6{0%{transform:translate(0,0);opacity:1}6%{transform:translate(16px,-16px);opacity:0}6.5%{transform:translate(-16px,16px);opacity:0}14%,100%{transform:translate(0,0);opacity:1}}
@keyframes trail6{0%{opacity:0;transform:translate(0,0)}3%{opacity:.9}7%{opacity:0;transform:translate(9px,-9px)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.lift,.guide,.tagin,.chipin,.kf,.ln,.caret,.k1,.k2,.k3,.s1,.s2,.s3,.playhead,.ic,.floor{animation:none}.s1{transform:scaleX(.62)}.s2{transform:scaleX(.31)}.s3{transform:scaleX(.8)}.guide,.tagin,.chipin,.ln{opacity:1}.trail{opacity:0}}
